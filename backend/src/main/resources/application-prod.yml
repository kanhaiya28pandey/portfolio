spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:portfolio}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:portfolio_pass}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.pandeyjee.portfolio: INFO
