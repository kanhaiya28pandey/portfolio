server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:kanhaiya542112@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 7000
          timeout: 7000
          writetimeout: 7000

# Portfolio Application Custom Properties
portfolio:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    cookie-name: pj_admin_token
  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:PandeyJee@2026Secure}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  mail:
    enabled: ${MAIL_ENABLED:true}
    recipient: ${MAIL_RECIPIENT:kanhaiya542112@gmail.com}
    resend-api-key: ${RESEND_API_KEY:}
    web3forms-key: ${WEB3FORMS_ACCESS_KEY:}
    brevo-api-key: ${BREVO_API_KEY:}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
